[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RICOH3504ex_MCP"
version = "1.0.0"
description = "MCP server for managing RICOH MP C3504ex printer address book"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "wanli523", email = "wanli523@example.com"}
]
keywords = ["mcp", "ricoh", "printer", "address-book"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=0.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "urllib3>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/wanli523/RICOH3504ex_MCP"
Repository = "https://github.com/wanli523/RICOH3504ex_MCP.git"
Issues = "https://github.com/wanli523/RICOH3504ex_MCP/issues"

[project.scripts]
ricoh3504ex-mcp = "main:main"
